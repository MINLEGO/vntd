[project]
name = "vntd"
version = "2.0.0"
description = "Unofficial client for Vinted API"
readme = "README.md"
authors = [
    { name = "etienne-hd", email = "hode.etienne@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.15.0",
]

keywords = ["vntd", "vinted", "wrapper", "api"]

[project.urls]
Homepage = "https://github.com/MINLEGO/vntd"
Repository = "https://github.com/MINLEGO/vntd"
Changelog = "https://github.com/MINLEGO/vntd/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
